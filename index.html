<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nós Dois</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main id="intro">

        <!-- BUMBLE -->

        <div id="bumble-container">

            <div id="bumble-glow"></div>

            <div id="bumble-circle">

                <img id="bumble-logo" src="assets/logo-bumble.png" alt="Bumble">

            </div>

        </div>


        <!-- FOTOS -->

        <div id="people">

            <div id="person-you" class="person">

                <img src="assets/eu.jpg" alt="eu">

            </div>


            <div id="person-her" class="person">

                <img src="assets/ela.jpg" alt="ela">

            </div>

        </div>


        <!-- LINHAS DE CONEXÃO -->

        <svg id="connection-lines" viewBox="0 0 100 100">

            <line id="line-you"></line>

            <line id="line-her"></line>

            <line id="line-bottom"></line>

        </svg>

    </main>


    <!-- SOM -->

    <audio id="bubble-sound" preload="auto">

        <source src="assets/bolha.mp3" type="audio/mpeg">

    </audio>


    <script src="script.js"></script>

</body>

</html>
